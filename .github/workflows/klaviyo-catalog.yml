name: Klaviyo Catalog Sync

# Pushes WC price + availability (+ fixes url/image) to the Klaviyo custom
# catalog, which powers the dynamic product blocks / browse-abandon /
# back-in-stock flows. Manual dispatch previews by default (dry-run); pick
# execute=true for a live push. The daily schedule keeps prices/stock fresh
# so the catalog never rots back to null.

on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Push to Klaviyo (true) or dry-run preview only (false)'
        type: boolean
        default: false
  schedule:
    - cron: '30 6 * * *'   # 06:30 UTC daily

permissions:
  contents: read

jobs:
  sync-klaviyo-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r feeds/requirements.txt

      - name: Create .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          WC_BASE_URL=${{ secrets.WC_BASE_URL }}
          WC_CK=${{ secrets.WC_CK }}
          WC_CS=${{ secrets.WC_CS }}
          WP_WOO_CONSUMER_KEY=${{ secrets.WP_WOO_CONSUMER_KEY }}
          WP_WOO_CONSUMER_SECRET=${{ secrets.WP_WOO_CONSUMER_SECRET }}
          CF_WORKER_URL=${{ secrets.CF_WORKER_URL }}
          CF_WORKER_SECRET=${{ secrets.CF_WORKER_SECRET }}
          KLAVIYO_API=${{ secrets.KLAVIYO_API }}
          ENVEOF

      - name: Unit tests (gate)
        run: pytest feeds/tests/ -q

      - name: Rebuild feed master from WooCommerce
        run: python -m feeds.build_feed_master

      - name: Sync Klaviyo catalog
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.execute }}" = "true" ]; then
            echo "Mode: EXECUTE (live push to Klaviyo)"
            python -m feeds.sync.sync_klaviyo_catalog --execute
          else
            echo "Mode: DRY-RUN (preview only, no writes)"
            python -m feeds.sync.sync_klaviyo_catalog
          fi

      - name: Upload sync log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klaviyo-sync-log
          path: feeds/sync/*-klaviyo-sync-log.json
          if-no-files-found: ignore
